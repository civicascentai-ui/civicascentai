name: Stripe sandbox single-checkout smoke (no real money)
on:
  push:
    branches: [qa/friday-secure-delivery-20261010]
    paths:
      - "qa/e2e/stripe-starter-checkout.once.mjs"
      - ".github/workflows/stripe-one-time-sandbox.yml"
permissions:
  contents: read
concurrency:
  group: stripe-sandbox-single-session-oct10
  cancel-in-progress: false
jobs:
  sandbox-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser package
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Execute ONE existing Stripe TEST-mode Starter session
        run: node qa/e2e/stripe-starter-checkout.once.mjs
      - name: Save failure screenshot (diagnostic only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: starter-sandbox-failure
          path: stripe-sandbox-failure.png
          if-no-files-found: ignore
          retention-days: 1
