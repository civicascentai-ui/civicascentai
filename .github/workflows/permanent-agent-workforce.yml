name: Blue Crew
on:
  push:
    branches:
      - automation/permanent-readonly-workforce-20261014
    paths:
      - .github/workflows/permanent-agent-workforce.yml
      - agents/autonomous_worker.py
  workflow_dispatch:
  schedule:
    - cron: '29 12,22 * * *'

permissions:
  contents: read
  issues: read

concurrency:
  group: permanent-readonly-agents-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent-check:
    if: github.repository == 'civicascentai-ui/civicascentai'
    name: ${{ matrix.role }} | verified read-only work
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        role: [sam, friday, zebra, reach, codi]
    steps:
      - name: Checkout source with no persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce public standard runner and authorized source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "civicascentai-ui/civicascentai"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          req = urllib.request.Request("https://api.github.com/repos/" + repo,headers={"Accept":"application/vnd.github+json","User-Agent":"CivicAscent-NoCost-Guard"})
          with urllib.request.urlopen(req,timeout=20) as response:
              info=json.load(response)
          assert info.get("private") is False, "STOP: GitHub public repository condition required"
          print("PASS: public standard Linux GitHub-hosted runner")
          PY
      - name: Offline role and URL security self-test
        run: python3 agents/autonomous_worker.py --role ${{ matrix.role }} --offline-self-check
      - name: Execute bounded autonomous read-only role task
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 agents/autonomous_worker.py --role ${{ matrix.role }}
      - name: Preserve individual role receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civic-agent-${{ matrix.role }}-${{ github.run_id }}
          path: agent-receipts/${{ matrix.role }}.json
          retention-days: 1
          if-no-files-found: warn
