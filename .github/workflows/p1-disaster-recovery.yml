name: P1 legacy manual code snapshot and Sunday production/shadow HTTP smoke
on:
  schedule:
    - cron: '47 9 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p1-disaster-recovery.yml'
permissions:
  contents: read
concurrency:
  group: p1-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  nightly-code-recovery:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture restoreable repository history and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          git fetch --no-tags origin main production/shadow-concat-20261014:refs/remotes/origin/production/shadow-concat-20261014
          git bundle create recovery/civicascentai-repository.bundle --all
          git bundle verify recovery/civicascentai-repository.bundle
          mkdir -p "$RUNNER_TEMP/recovery-restore"
          git clone recovery/civicascentai-repository.bundle "$RUNNER_TEMP/recovery-restore/repository"
          test "$(git -C "$RUNNER_TEMP/recovery-restore/repository" rev-parse HEAD)" = "$(git rev-parse HEAD)"
          git -C "$RUNNER_TEMP/recovery-restore/repository" fsck --full --no-reflogs
          echo 'PASS: backup bundle cloned, checked out at matching commit, and Git objects validated' > recovery/RESTORE-TEST.txt
          git rev-parse origin/main > recovery/main.sha
          git rev-parse origin/production/shadow-concat-20261014 > recovery/shadow.sha
          git -C "$RUNNER_TEMP/recovery-restore/repository" cat-file -e "$(cat recovery/shadow.sha)^{commit}"
          echo 'PASS: shadow commit is present in restored bundle' >> recovery/RESTORE-TEST.txt
          sha256sum recovery/civicascentai-repository.bundle > recovery/SHA256SUMS
          date -u +%Y-%m-%dT%H:%M:%SZ > recovery/captured-at-utc.txt
          echo 'Code and Git history only. This does NOT back up databases, Vercel environment variables, secrets, or external services.' > recovery/SCOPE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p1-code-recovery-${{ github.run_id }}
          path: recovery/
          retention-days: 30
          if-no-files-found: error
  weekly-crossover-rehearsal:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.schedule == '47 9 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only production/standby page and asset parity gate
        shell: bash
        env:
          PRODUCTION_URL: https://civicascentai.com
          SHADOW_URL: https://civicascentai-launch-qa.vercel.app
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'route\tproduction_http\tstandby_http\tproduction_sha256\tstandby_sha256\tparity\n' > evidence/route-parity.tsv
          failures=0
          for route in root index.html safari-home.html es.html register.html journey-learn.html journey-try.html journey-help.html journey-continue.html practice-sandbox.html veterans.html free-ai-starter.html programs.html course.html consultation.html curso-es.html registro.html clear-start.html capabilities.html mentor.html learner-questions.html assets/home-reference.css assets/home-reference.js assets/civicascent-logo.svg assets/safari-build1-live.css assets/veterans-entrance.css assets/clear-start.css assets/practice-lab.css assets/learner-preferences.js assets/practice-lab.js styles.css; do
            suffix="$route"
            if [ "$route" = root ]; then suffix=""; fi
            slug=$(printf '%s' "$route" | tr '/' '_')
            production_file="$RUNNER_TEMP/p1-production-$slug"
            standby_file="$RUNNER_TEMP/p1-standby-$slug"
            production_http=$(curl --location --silent --show-error --max-time 25 --output "$production_file" --write-out '%{http_code}' "$PRODUCTION_URL/$suffix") || production_http=000
            standby_http=$(curl --location --silent --show-error --max-time 25 --output "$standby_file" --write-out '%{http_code}' "$SHADOW_URL/$suffix") || standby_http=000
            production_sha="-"
            standby_sha="-"
            if [ -f "$production_file" ]; then production_sha=$(sha256sum "$production_file" | cut -d' ' -f1); fi
            if [ -f "$standby_file" ]; then standby_sha=$(sha256sum "$standby_file" | cut -d' ' -f1); fi
            parity=FAIL
            if [ "$production_http" = 200 ] && [ "$standby_http" = 200 ] && cmp -s "$production_file" "$standby_file"; then
              parity=PASS
            else
              failures=$((failures + 1))
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$route" "$production_http" "$standby_http" "$production_sha" "$standby_sha" "$parity" | tee -a evidence/route-parity.tsv
          done
          echo 'Read-only GET parity only. NO DNS cutover, production rollback, database recovery, payments, or production deployment was performed.' > evidence/SCOPE.txt
          test "$failures" -eq 0
      - name: Preserve pass/fail receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-crossover-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 30
