name: Safari Build 1 browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "journey-*.html"
      - "assets/safari-build1-live.css"
      - "tests/test_safari_build1_browser.py"
      - ".github/workflows/safari-build1-browser-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Real browser navigation and mobile checks
        run: python tests/test_safari_build1_browser.py
      - name: Upload screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-build1-visual-evidence
          path: artifacts/safari-build1/
          if-no-files-found: warn
