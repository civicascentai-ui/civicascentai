name: QA post-save email redirect one-time check
on:
  push:
    branches: [qa/friday-secure-delivery-20261010]
    paths:
      - "qa/e2e/auth-email-post-save.once.mjs"
      - ".github/workflows/qa-auth-post-save.once.yml"
permissions:
  contents: read
concurrency:
  group: qa-auth-post-save-20261011-once
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Request one QA confirmation email
        run: node qa/e2e/auth-email-post-save.once.mjs
