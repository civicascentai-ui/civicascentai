name: Signup-only Paid Checkout Hold QA
on:
  push:
    branches:
      - safety/signup-only-paid-checkout-hold-20261014
    paths:
      - .github/workflows/signup-only-hold-qa.yml
      - tests/verify_signup_only.mjs
      - api/create-checkout-session.js
      - register.html
      - registro.html
      - course.html
      - curso-es.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-no-charge-gate:
    if: github.repository == 'civicascentai-ui/civicascentai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted GitHub token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify card charging stays disabled while $0 bilingual registration is linked
        run: node tests/verify_signup_only.mjs
