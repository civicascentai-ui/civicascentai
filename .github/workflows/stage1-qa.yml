name: Stage 1 QA
on:
  push:
    branches:
      - qa/learner-access-ui-20261009
  pull_request:
    paths:
      - '**/*.html'
      - 'tests/**'
      - '.github/workflows/stage1-qa.yml'
  workflow_dispatch:
jobs:
  release-hold:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Stage 1 release checks
        run: node --test tests/paid-enrollment-release-hold.test.js
