name: Mobile QA
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8080 >/tmp/civicascent-http.log 2>&1 &
          sleep 2
      - name: Run mobile QA
        run: node qa/mobile_qa.js
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-qa-screenshots
          path: qa/mobile-screenshots/
          if-no-files-found: warn
