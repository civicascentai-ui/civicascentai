name: GG independent site audit
on:
  workflow_dispatch:
    inputs:
      run_gemini:
        description: 'Request Gemini review (requires separate paid-usage approval)'
        type: boolean
        default: false
      gg_paid_usage_approved:
        description: 'I verified billing and explicitly approve possible Gemini API charges'
        type: boolean
        default: false
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: read
concurrency:
  group: gg-site-audit
  cancel-in-progress: false
jobs:
  http-and-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only site checks; diagnose Gemini only with separate approval
        env:
          RUN_GEMINI: ${{ inputs.run_gemini || 'false' }}
          GG_PAID_USAGE_APPROVED: ${{ inputs.gg_paid_usage_approved || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/qa/gg_site_audit.py
      - name: Upload audit evidence even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gg-http-evidence-${{ github.run_id }}
          path: gg-audit/
          retention-days: 14
  browser-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install headless browser
        run: |
          python3 -m pip install --user playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Read-only browser navigation and accessibility indicators
        run: |
          mkdir -p gg-browser
          cat > /tmp/gg_browser.py <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          base="https://civicascentai.com/"
          paths=["","journey-learn.html","journey-try.html","journey-help.html","journey-continue.html","free-ai-starter.html","register.html"]
          results=[]
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              for path in paths:
                  page=browser.new_page(viewport={"width":390,"height":844},reduced_motion="reduce")
                  item={"path":"/"+path}
                  try:
                      resp=page.goto(base+path,wait_until="domcontentloaded",timeout=30000)
                      page.wait_for_timeout(400)
                      item["http_status"]=resp.status if resp else None
                      item["title"]=page.title()
                      item["main_count"]=page.locator("main").count()
                      item["html_lang"]=page.locator("html").get_attribute("lang")
                      item["missing_image_alt"]=page.locator("img:not([alt])").count()
                      item["unlabeled_buttons"]=page.locator("button:not([aria-label]):not([aria-labelledby])").evaluate_all("(els)=>els.filter(e=>!e.innerText.trim()).length")
                      item["horizontal_overflow"]=page.evaluate("document.documentElement.scrollWidth > innerWidth + 2")
                      item["internal_links"]=page.locator('a[href^="/"], a[href^="https://civicascentai.com"]').count()
                      item["pass"]=item["http_status"]==200 and bool(item["title"]) and bool(item["html_lang"]) and item["missing_image_alt"]==0 and item["unlabeled_buttons"]==0 and not item["horizontal_overflow"]
                  except Exception as exc:
                      item["pass"]=False
                      item["error"]=str(exc)[:250]
                  results.append(item)
                  page.close()
              browser.close()
          Path("gg-browser/browser-audit.json").write_text(json.dumps({"checks":results,"all_pass":all(r["pass"] for r in results),"limitations":["Automated smoke indicators only; not WCAG certification, full keyboard testing, registration submission or payment testing"]},indent=2))
          for r in results: print(r["path"],"PASS" if r["pass"] else "FAIL",r.get("error",""))
          if not all(r["pass"] for r in results): raise SystemExit("Browser QC defects; inspect artifact")
          PY
          python3 /tmp/gg_browser.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gg-browser-evidence-${{ github.run_id }}
          path: gg-browser/
          retention-days: 14
