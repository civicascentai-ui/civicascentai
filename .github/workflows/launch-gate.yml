name: Launch Gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-launch-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run CivicAscent launch gate
        run: python qa/launch_gate.py
