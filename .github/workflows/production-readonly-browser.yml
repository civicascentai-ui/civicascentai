name: Production read-only browser diagnostic
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tests/test_production_readonly.py"
      - "production-tests/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/production-readonly-browser.yml"
permissions:
  contents: read
jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run GET-only production browser diagnostic
        run: python tests/test_production_readonly.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Node Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run TypeScript GET-only production smoke
        run: npm run test:production
        env:
          PROD_URL: https://civicascentai.com
      - name: Save report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readonly-browser-evidence
          path: |
            artifacts/production-readonly/
            playwright-report/
            test-results/
          if-no-files-found: warn
