name: One-time Supabase QA email authentication preflight
on:
  push:
    branches: [qa/friday-secure-delivery-20261010]
    paths:
      - "qa/e2e/auth-email-preflight.mjs"
      - ".github/workflows/qa-auth-email-once.yml"
permissions:
  contents: read
concurrency:
  group: qa-work-inbox-otp-once-20261011
  cancel-in-progress: false
jobs:
  email-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Make one QA Auth sign-in email request without logging tokens
        run: node qa/e2e/auth-email-preflight.mjs
