name: Real Homepage WCAG-Oriented Browser Gate
on:
  push:
    branches:
      - fix/home-wcag-entry-20261015
    paths:
      - index.html
      - assets/home-accessible.css
      - tests/test_home_wcag.py
      - .github/workflows/home-wcag-qa.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homepage-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test real homepage before merge with no public purchases
        run: python tests/test_home_wcag.py
      - name: Preserve screenshots and QC records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-wcag-preproduction-browser
          path: artifacts/home-wcag/
          retention-days: 14
          if-no-files-found: warn
