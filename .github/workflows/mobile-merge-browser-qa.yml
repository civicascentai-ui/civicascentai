name: Controlled mobile merge browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - "course.html"
      - "styles.css"
      - "tests/test_mobile_merge_browser.py"
      - ".github/workflows/mobile-merge-browser-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test real browser click paths
        run: python tests/test_mobile_merge_browser.py
      - name: Save screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-merge-browser-evidence
          path: artifacts/mobile-merge/
          if-no-files-found: warn
