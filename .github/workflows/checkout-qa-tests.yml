name: Checkout QA safety tests
on:
  workflow_dispatch:
  push:
    branches:
      - qa/external-launch-acceptance-20261009
    paths:
      - 'api/stripe-webhook.js'
      - 'tests/**'
      - '.github/workflows/checkout-qa-tests.yml'
jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run isolated checkout tests
        run: node --test tests/checkout-safety.test.js tests/checkout-runtime-safety.test.js
