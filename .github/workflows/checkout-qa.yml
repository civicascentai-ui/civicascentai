name: Checkout QA
on:
  push:
    branches:
      - qa/external-launch-acceptance-20261009
  pull_request:
    paths:
      - 'api/stripe-webhook.js'
      - 'thank-you.html'
      - 'tests/**'
      - 'package.json'
jobs:
  checkout-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify checkout repository root
        run: |
          test -f api/stripe-webhook.js
          test -f tests/checkout-safety.test.js
          node -e "const p=require('./package.json'); if(!p.scripts?.test || !p.dependencies?.stripe) process.exit(1)"
      - run: npm test
