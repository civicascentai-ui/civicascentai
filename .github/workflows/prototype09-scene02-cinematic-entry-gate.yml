name: Prototype 09 Scene 02 Cinematic Entry Gate

on:
  push:
    branches:
      - build/prototype09-scene02-cinematic-entry-2026-09-29
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cinematic-entry:
    name: Cinematic Entry Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: prototype-react
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: prototype-react
        run: npm run build

      - name: Verify build output
        run: |
          test -s prototype-react/dist/index.html
          test -d prototype-react/dist/assets

      - name: Verify cinematic entry contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("prototype-react/src/App.jsx").read_text()
          css = Path("prototype-react/src/styles.css").read_text()

          required = [
              "onEnded={() => setLanded(true)}",
              "Start Here",
              "landing-moment",
              "start-cue",
              "prefers-reduced-motion",
              "92833d99-5bd0-4982-82cb-2ded0ae10408.mp4"
          ]

          forbidden = [
              "world-hotspot",
              "hotspot-label",
              "path-card",
              "path-rail",
              "card-grid",
              "dashboard",
              "brochure",
              "Learn AI",
              "Create</",
              "Work</",
              "Explore</"
          ]

          missing = [x for x in required if x not in app and x not in css]
          present = [x for x in forbidden if x in app or x in css]

          if missing:
              print("Missing cinematic-entry requirements:")
              for item in missing:
                  print("-", item)
              raise SystemExit(1)

          if present:
              print("Forbidden UI or premature navigation detected:")
              for item in present:
                  print("-", item)
              raise SystemExit(1)

          print("Cinematic entry contract passed.")
          PY

      - name: Reject retired-theme drift
        run: |
          if grep -RIniE 'train|subway|roblox' prototype-react/src; then
            echo "Retired-theme drift detected."
            exit 1
          fi
