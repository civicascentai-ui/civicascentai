name: Veterans fulfillment isolated QA
on:
  pull_request:
    paths:
      - 'agents/veterans_fulfillment.py'
      - 'tests/test_veterans_fulfillment.py'
      - '.github/workflows/veterans-fulfillment-qa.yml'
  push:
    branches:
      - qa/veterans-fulfillment-verification-20261012
    paths:
      - 'agents/veterans_fulfillment.py'
      - 'tests/test_veterans_fulfillment.py'
      - '.github/workflows/veterans-fulfillment-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-fulfillment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute persisted fulfillment regression suite
        run: python -m unittest discover -s tests -p 'test_veterans_fulfillment.py' -v
