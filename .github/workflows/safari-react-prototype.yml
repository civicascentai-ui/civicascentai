name: Safari React Prototype

on:
  push:
    branches:
      - main
      - feature/mobbin-patterns-2026-09-30
    paths:
      - "prototype-react/**"
      - ".github/workflows/safari-react-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototype-react

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -s dist/index.html

      - name: Static accessibility guardrails
        run: |
          grep -q 'aria-labelledby="page-title"' src/App.jsx
          grep -q 'role="dialog"' src/App.jsx
          grep -q 'prefers-reduced-motion: reduce' src/styles.css
          grep -q 'Skip to learning choices' src/App.jsx
