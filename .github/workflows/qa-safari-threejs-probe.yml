name: Zero-cost Safari Three.js probe QA
on:
  push:
    branches:
      - 'experiment/zero-cost-threejs-safari-*'
    paths:
      - 'experiments/safari-threejs-atmosphere.js'
      - 'experiments/test-threejs-safari.cjs'
      - 'experiments/browser-qa-threejs.cjs'
      - 'index.html'
      - '.github/workflows/qa-safari-threejs-probe.yml'
  pull_request:
    paths:
      - 'experiments/**'
      - 'index.html'
permissions:
  contents: read
jobs:
  static-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep original homepage unchanged and verify optional module
        run: node experiments/test-threejs-safari.cjs
      - name: Install free Chromium browser test tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run browser screenshot, WebGL and accessibility-fallback checks
        run: node experiments/browser-qa-threejs.cjs
      - name: Retain private-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-threejs-review
          path: screenshots/
          if-no-files-found: warn
          retention-days: 3
