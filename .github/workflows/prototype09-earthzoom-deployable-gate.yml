name: Prototype 09 Earth Zoom Deployable Gate

on:
  push:
    branches:
      - deployable/prototype09-earthzoom-2026-09-29
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployable:
    name: Deployable Movie Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: prototype-react
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: prototype-react
        run: npm run build

      - name: Verify build output
        run: |
          test -s prototype-react/dist/index.html
          test -d prototype-react/dist/assets

      - name: Verify movie-first deployable contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path("prototype-react/src/App.jsx").read_text()
          css = Path("prototype-react/src/styles.css").read_text()

          required = [
              "<video",
              "autoPlay",
              "muted",
              "playsInline",
              "preload=\"metadata\"",
              "prefers-reduced-motion",
              "viral_hub_video",
              "movie-shell",
              "movie-media"
          ]

          forbidden = [
              "world-hotspot",
              "hotspot-label",
              "path-card",
              "path-rail",
              "card-grid",
              "scene-transition",
              "dashboard",
              "brochure"
          ]

          missing = [x for x in required if x not in app and x not in css]
          present = [x for x in forbidden if x in app or x in css]

          if missing:
              print("Missing deployable movie requirements:")
              for item in missing:
                  print("-", item)
              raise SystemExit(1)

          if present:
              print("Forbidden UI structures detected:")
              for item in present:
                  print("-", item)
              raise SystemExit(1)

          print("Movie-first deployable contract passed.")
          PY

      - name: Reject retired-theme drift
        run: |
          if grep -RIniE 'train|subway|roblox' prototype-react/src; then
            echo "Retired-theme drift detected."
            exit 1
          fi
