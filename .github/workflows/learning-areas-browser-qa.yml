name: Accessible Learning Areas Retest
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/safari-removal-active-20261015]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test accessible home, four room paths, Veterans, guides, practice, and languages
        run: python tests/test_learning_areas_browser.py
      - name: Save screenshots and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-areas-qa-screenshots
          path: artifacts/learning-areas/
          retention-days: 14
          if-no-files-found: warn
