name: Plan B cutover safety gate
on:
  push:
    branches:
      - qa/friday-secure-delivery-20261010
    paths:
      - 'course.html'
      - 'tests/qa-plan-b-cutover-safety.test.mjs'
      - '.github/workflows/qa-plan-b-cutover.yml'
  pull_request:
    branches:
      - qa/checkout-bottleneck-repair-20261010
    paths:
      - 'course.html'
      - 'tests/qa-plan-b-cutover-safety.test.mjs'
      - '.github/workflows/qa-plan-b-cutover.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze-protection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate paused enrollment and rollback baseline
        run: node --test tests/qa-plan-b-cutover-safety.test.mjs
