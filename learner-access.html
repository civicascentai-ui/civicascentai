<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <title>Learner Access | CivicAscent AI</title><link rel="icon" href="assets/civicascent-logo.svg" type="image/svg+xml">
  <style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#06142d;color:#fff}body{margin:0;min-height:100vh;display:grid;place-items:center}.shell{width:min(680px,calc(100% - 32px));padding:32px;background:#0d2447;border:1px solid #5271a3;border-radius:20px;box-sizing:border-box}header{display:flex;justify-content:space-between;gap:16px;align-items:center}button,input{font:inherit;border-radius:8px;padding:.8rem}input{width:100%;box-sizing:border-box;margin:.4rem 0 1rem;color:#111;background:#fff;border:2px solid #fff}button{background:#47d7ac;color:#051811;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.6}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ffd75a;outline-offset:3px}.quiet{background:transparent;color:#fff;border:1px solid #9db0d2}article{background:#fff;color:#132238;padding:18px;border-radius:12px;margin-top:12px}.notice{min-height:1.5em;margin-top:18px}.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:16px;background:#fff;color:#111;padding:8px}</style>
</head>
<body><a class="skip" href="#main">Skip to main content</a><main class="shell" id="main">
  <header><img src="assets/civicascent-logo.svg" width="56" height="56" alt="CivicAscent AI"><button class="quiet" id="language" type="button">ES</button></header>
  <h1 data-copy="title">Learner access</h1><p data-copy="lead">Use the same verified email address used for an approved sandbox purchase.</p>
  <form id="sign-in-form"><label for="email" data-copy="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><button type="submit" data-copy="send">Send secure sign-in link</button></form>
  <section id="session" hidden><p data-copy="signed">Signed in for this browser tab.</p><button class="quiet" id="sign-out" type="button" data-copy="signout">Sign out</button><h2 data-copy="status">Purchase status</h2></section>
  <section aria-labelledby="purchases-heading"><h2 id="purchases-heading" data-copy="courses">Your courses</h2><div id="purchases" aria-live="polite" aria-atomic="false"></div></section><p class="notice" id="message" role="status" aria-live="polite"></p>
</main><script src="assets/learner-access.js" defer></script></body></html>
