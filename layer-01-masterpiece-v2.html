<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04070b">
<meta name="description" content="CivicAscent AI — Layer 1 living masterpiece canvas.">
<title>CivicAscent AI — Living Canvas</title>
<link rel="icon" href="assets/civicascent-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/layer-01-masterpiece-v2.css?v=1">
</head>
<body>
<main class="canvas-world" id="canvasWorld" aria-label="Cinematic living station environment">
  <canvas id="skyCanvas" aria-hidden="true"></canvas>
  <canvas id="lifeCanvas" aria-hidden="true"></canvas>

  <div class="architecture" aria-hidden="true">
    <div class="vault v1"></div><div class="vault v2"></div><div class="vault v3"></div>
    <div class="rib r1"></div><div class="rib r2"></div><div class="rib r3"></div><div class="rib r4"></div><div class="rib r5"></div>
    <div class="far-wall">
      <div class="wall-light wl1"></div><div class="wall-light wl2"></div><div class="wall-light wl3"></div>
      <div class="station-word">CIVICASCENT CENTRAL</div>
    </div>
  </div>

  <div class="platform-world" aria-hidden="true">
    <div class="platform-floor"></div>
    <div class="wet-reflection"></div>
    <div class="platform-edge"></div>
    <div class="track-bed"></div>
    <div class="rail rail1"></div><div class="rail rail2"></div>
    <div class="sleepers"></div>
  </div>

  <div class="scene-life" aria-hidden="true">
    <div class="person p1"></div><div class="person p2"></div><div class="person p3"></div><div class="person p4"></div>
    <div class="bench bench1"></div><div class="bench bench2"></div>
    <div class="distant-screen ds1"></div><div class="distant-screen ds2"></div>
  </div>

  <div class="train train-a" aria-hidden="true">
    <div class="train-shell">
      <div class="nose"></div>
      <div class="windows">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="lightline"></div>
    </div>
  </div>

  <div class="train train-b" aria-hidden="true">
    <div class="train-shell ghost">
      <div class="windows">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>
  </div>

  <div class="light-volume warm" aria-hidden="true"></div>
  <div class="light-volume cool" aria-hidden="true"></div>
  <div class="moving-beam" aria-hidden="true"></div>
  <div class="mist mist-a" aria-hidden="true"></div>
  <div class="mist mist-b" aria-hidden="true"></div>
  <div class="glass-layer" aria-hidden="true"></div>
  <div class="foreground-reflection fr-a" aria-hidden="true"></div>
  <div class="foreground-reflection fr-b" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
</main>
<script src="assets/layer-01-masterpiece-v2.js?v=1" defer></script>
</body>
</html>
