<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CivicAscent AI — Browser Diagnostic</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#020409;color:#eef7ff;font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:32px}
main{max-width:820px;margin:auto}h1{font-size:clamp(2rem,6vw,4rem);margin:.1em 0}.sub{color:#9fb1c3;margin-bottom:28px}
.row{display:grid;grid-template-columns:1fr auto;gap:18px;padding:16px 0;border-bottom:1px solid #ffffff18}.status{font-weight:800}.pass{color:#73ffbe}.fail{color:#ff7c7c}.wait{color:#ffd27b}
#summary{margin-top:28px;padding:18px;border:1px solid #ffffff20;border-radius:14px}.small{font-size:.85rem;color:#9fb1c3;word-break:break-word}
a{color:#65e7ff}
</style>
</head>
<body>
<main>
<p class="sub">STOP-THE-LINE VERIFICATION</p>
<h1>Browser diagnostic</h1>
<p class="sub">This page checks the exact browser capabilities and same-origin assets required by Model 05.</p>
<div id="checks"></div>
<div id="summary"><strong>Running checks…</strong></div>
<p class="small" id="details"></p>
</main>
<script src="assets/vendor/three-r159.min.js"></script>
<script src="assets/vendor/gsap-3.13.0.min.js"></script>
<script>
(async()=>{
 const checks=[
  ['Three.js loaded',()=>!!window.THREE],
  ['GSAP loaded',()=>!!window.gsap],
  ['WebGL available',()=>{try{const c=document.createElement('canvas');return !!(c.getContext('webgl2')||c.getContext('webgl'))}catch(e){return false}}],
  ['Model 05 CSS',()=>fetch('assets/model-05-preview.css',{cache:'no-store'}).then(r=>r.ok)],
  ['Model 05 JS',()=>fetch('assets/model-05-preview.js',{cache:'no-store'}).then(r=>r.ok)],
  ['PC preview HTML',()=>fetch('model-05-pc-preview.html',{cache:'no-store'}).then(r=>r.ok)],
  ['Mobile preview HTML',()=>fetch('model-05-mobile-preview.html',{cache:'no-store'}).then(r=>r.ok)],
  ['Doorway preview HTML',()=>fetch('model-05-doorway-preview.html',{cache:'no-store'}).then(r=>r.ok)]
 ];
 const box=document.getElementById('checks'), results=[];
 for(const [name,fn] of checks){
   const row=document.createElement('div');row.className='row';
   row.innerHTML='<span>'+name+'</span><span class="status wait">CHECKING</span>';box.appendChild(row);
   let ok=false;try{ok=await fn()}catch(e){ok=false}
   row.lastChild.textContent=ok?'PASS':'FAIL';row.lastChild.className='status '+(ok?'pass':'fail');results.push(ok);
 }
 const ok=results.every(Boolean), summary=document.getElementById('summary');
 summary.innerHTML=ok?'<strong class="pass">ALL CHECKS PASS</strong><div>Browser and Model 05 preview dependencies are available.</div>':'<strong class="fail">CHECK FAILED</strong><div>Do not resume development. A required browser capability or published asset is unavailable.</div>';
 document.getElementById('details').textContent='UA: '+navigator.userAgent+' | URL: '+location.href;
})();
</script>
</body>
</html>
