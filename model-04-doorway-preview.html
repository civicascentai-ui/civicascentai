<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02050a">
<title>CivicAscent AI — Living Doorway</title>
<link rel="icon" href="assets/civicascent-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/model-04-preview.css?v=1">
</head>
<body class="doorway-world">
<canvas id="world" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<header class="brandbar">
  <a href="model-04-pc-preview.html" class="brand"><img src="assets/civicascent-logo.svg" alt=""><span>CivicAscent <b>AI</b></span></a>
  <span class="beta">LIVING DOORWAY</span>
</header>

<main class="doorway-main">
  <section class="doorway-copy" aria-live="polite">
    <p class="eyebrow" id="worldEyebrow">LIVING AI WORLD</p>
    <h1 id="worldTitle">Learn with<br><span>AI beside you.</span></h1>
    <p class="lead" id="worldLead">The environment changes as the idea becomes clearer.</p>
  </section>

  <button class="world-object" id="worldObject" aria-label="Activate this living AI demonstration">
    <span class="object-core"></span>
    <span class="object-ring one"></span>
    <span class="object-ring two"></span>
    <span class="object-ring three"></span>
  </button>

  <div class="transformation" id="transformation" aria-hidden="true">
    <span class="beam b1"></span><span class="beam b2"></span><span class="beam b3"></span>
  </div>

  <p class="doorway-hint" id="doorwayHint">Touch the light.</p>
  <a class="return-path" href="model-04-pc-preview.html" aria-label="Return to the CivicAscent living world"><span></span>Return through the valley</a>
</main>

<script src="assets/model-04-preview.js?v=1" defer></script>
</body>
</html>
