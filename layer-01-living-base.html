<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05090e">
<meta name="description" content="CivicAscent AI Layer 1 living base — cinematic environmental study.">
<title>CivicAscent AI — Layer 1 Living Base</title>
<link rel="icon" href="assets/civicascent-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/layer-01-living-base.css?v=1">
</head>
<body>
<main class="world" id="world" aria-label="Cinematic CivicAscent station environment">
  <canvas id="atmosphere" aria-hidden="true"></canvas>

  <div class="depth depth-far" aria-hidden="true">
    <div class="ceiling">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="rear-wall">
      <div class="panel p1"></div><div class="panel p2"></div><div class="panel p3"></div>
      <div class="light-strip l1"></div><div class="light-strip l2"></div>
      <div class="station-mark">CIVICASCENT CENTRAL</div>
    </div>
  </div>

  <div class="depth depth-mid" aria-hidden="true">
    <div class="column c1"></div><div class="column c2"></div><div class="column c3"></div>
    <div class="bench b1"></div><div class="bench b2"></div>
    <div class="figure f1"></div><div class="figure f2"></div><div class="figure f3"></div>
    <div class="platform-edge"></div>
  </div>

  <div class="depth depth-track" aria-hidden="true">
    <div class="track-bed"></div>
    <div class="rail r1"></div><div class="rail r2"></div>
    <div class="sleepers"></div>
    <div class="tunnel-glow"></div>
  </div>

  <div class="train-pass" aria-hidden="true">
    <div class="train-body">
      <div class="train-window-row">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="train-reflection"></div>
    </div>
  </div>

  <div class="depth depth-near" aria-hidden="true">
    <div class="foreground-glass"></div>
    <div class="reflection reflection-a"></div>
    <div class="reflection reflection-b"></div>
  </div>

  <div class="light-sweep" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="identity" aria-hidden="true">
    <img src="assets/civicascent-logo.svg" alt="">
  </div>
</main>

<script src="assets/layer-01-living-base.js?v=1" defer></script>
</body>
</html>
