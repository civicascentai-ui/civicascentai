<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f14">
<title>CivicAscent AI — Station Stop</title>
<link rel="icon" href="assets/civicascent-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/model-07.css?v=1">
</head>
<body class="station-doorway">
<header class="topbar">
  <a class="brand" href="model-07.html"><img src="assets/civicascent-logo.svg" alt=""><span>CivicAscent <b>AI</b></span></a>
  <span class="beta">STATION STOP · SAME BASELINE</span>
</header>

<main class="stop-scene">
  <div class="sky" aria-hidden="true"></div>
  <div class="platform-lights" aria-hidden="true"></div>

  <section class="stop-content" aria-live="polite">
    <p class="eyebrow" id="stopEyebrow">NEXT STOP</p>
    <h1 id="stopTitle">Learn with AI.</h1>
    <p class="lead" id="stopLead">Ask a question in everyday language and see the answer become easier to understand.</p>

    <div class="stop-action" id="stopAction">
      <div class="action-label">WHAT HAPPENS HERE</div>
      <p id="stopActionText">You ask. AI explains. You can ask again until it makes sense.</p>
    </div>

    <a class="return-link" href="model-07.html">← Back to CivicAscent Central</a>
  </section>

  <div class="train train-stop" aria-hidden="true">
    <div class="engine"><div class="windshield"></div><div class="headlight"></div></div>
    <div class="car car-1"><div class="windows"></div></div>
    <div class="car car-2"><div class="windows"></div></div>
  </div>

  <div class="station-name" id="stationName" aria-hidden="true">LEARNING STATION</div>
</main>

<script src="assets/model-07.js?v=1" defer></script>
</body>
</html>
